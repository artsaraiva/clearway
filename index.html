<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dioramania</title>
    <!-- The screen's two typefaces are the paper & stamp kit's (src/ui/kit.css), preloaded at the weights the status strip
         opens with; the caption of the Tile in the hand, which the renderer draws on the board, uses them too. Only their
         Latin letters ship: any other script falls back to the system's fonts, and Japanese stays in the speech bubbles,
         which the renderer draws in its own. -->
    <link rel="preload" href="/fonts/zen-maru-gothic-latin-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/zen-maru-gothic-latin-900.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/klee-one-latin-600.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* The page: the board fills it and the screen lies over it. The screen's colours, type and pieces are the paper &
         stamp kit's (src/ui/kit.css), and each part's styles sit beside its module in src/ui. */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f6f6f3;
      }
      #scene {
        width: 100%;
        height: 100%;
        display: block;
        /* A left drag pans the board. */
        cursor: grab;
        touch-action: none;
      }
      /* --- The screen: the status strip along the bottom (src/ui/strip.css), the toolbar above it in the middle
             (src/ui/toolbar.css), the camera's stickers on the right edge (src/ui/board.css), and top-left the menu
             and City notes stickers (src/ui/paused.css) over the slot for City notes or the Junction's note
             (src/ui/screen.css). Nothing covers the middle of the board. --- */
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        user-select: none;
      }
      #ui > * {
        position: absolute;
        pointer-events: auto;
      }
      #ui [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
