<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traffic Prototype</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f6f6f3;
        font:
          14px/1.4 -apple-system,
          BlinkMacSystemFont,
          'Helvetica Neue',
          sans-serif;
        color: #222;
      }
      #scene {
        width: 100%;
        height: 100%;
        display: block;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .panel {
        position: absolute;
        pointer-events: auto;
        background: rgba(255, 255, 255, 0.92);
        border-radius: 12px;
        padding: 12px 14px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }
      .gauge {
        top: 16px;
        left: 16px;
        width: 240px;
      }
      .time {
        top: 16px;
        right: 16px;
        display: flex;
        gap: 6px;
        padding: 8px;
      }
      .banner {
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        font-weight: 600;
        color: #30a46c;
      }
      .node {
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        width: 320px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .bar {
        position: relative;
        height: 10px;
        border-radius: 5px;
        background: #ececec;
        margin: 8px 0 6px;
        overflow: hidden;
      }
      #flow-fill {
        height: 100%;
        background: #f59e0b;
        transition: width 0.2s;
      }
      #flow-fill.good {
        background: #30a46c;
      }
      .mark {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: #222;
      }
      .sub,
      .hint {
        color: #777;
        font-size: 12px;
      }
      .prio {
        display: flex;
        gap: 6px;
        margin: 10px 0 8px;
      }
      button {
        flex: 1;
        border: 0;
        border-radius: 8px;
        padding: 6px 12px;
        background: #f0f0f0;
        font: inherit;
        cursor: pointer;
      }
      button.on {
        background: #222;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
