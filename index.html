<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dioramania</title>
    <!-- The screen's two typefaces are the paper & stamp kit's (src/ui/kit.css), preloaded at the weights the status strip
         opens with; the caption of the Tile in the hand, which the renderer draws on the board, uses them too. Only their
         Latin letters ship: any other script falls back to the system's fonts, and Japanese stays in the speech bubbles,
         which the renderer draws in its own. -->
    <link rel="preload" href="/fonts/zen-maru-gothic-latin-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/zen-maru-gothic-latin-900.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/klee-one-latin-600.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* What is left of the screen before the paper & stamp kit (src/ui/kit.css, which holds the theme's colours, type and
         pieces): each part's styles go as its ticket of #243 rebuilds it in the kit. */
      :root {
        --ink-soft: #545c6e;
        --line: rgba(27, 32, 48, 0.1);
        --press: rgba(27, 32, 48, 0.08);
        --hover: rgba(255, 255, 255, 0.55);
        /* Neutral frosted glass with no tint of its own, so it takes on the sky behind it. */
        --glass: rgba(255, 255, 255, 0.58);
        --glass-edge: rgba(255, 255, 255, 0.78);
        --shade: 0 8px 28px rgba(16, 24, 48, 0.16), 0 1px 3px rgba(16, 24, 48, 0.1);
        --edge: 18px;
        /* The accent of the selected button and the switch. */
        --accent: #ff3d8b;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f6f6f3;
      }
      #scene {
        width: 100%;
        height: 100%;
        display: block;
        /* A left drag pans the board. */
        cursor: grab;
        touch-action: none;
      }
      /* --- The screen: the status strip along the bottom (src/ui/strip.css), the bar above it in the middle, the
             camera's stickers on the right edge (src/ui/board.css), the menu on the left, and the Junction's panel
             top-right. Nothing covers the middle of the board. --- */
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        user-select: none;
      }
      #ui > * {
        position: absolute;
        pointer-events: auto;
      }
      #ui [hidden] {
        display: none;
      }
      .glass {
        background: var(--glass);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
        border: 1px solid var(--glass-edge);
        box-shadow: var(--shade);
      }
      #ui .on {
        background: var(--accent);
        color: #fff;
        box-shadow: 0 3px 10px rgba(255, 61, 139, 0.4);
      }
      .soft {
        font-size: 13px;
        color: var(--ink-soft);
      }

      .layout:not(.on):hover,
      .zone:not(.on):hover,
      .menu .item:hover {
        background: var(--hover);
      }

      /* The selected Junction's panel top-right: its name, Reset and a hint. Its Tools are in the world. */
      .junction {
        top: var(--edge);
        right: var(--edge);
        width: 236px;
        padding: 10px 12px 12px 16px;
        border-radius: 22px;
        display: grid;
        gap: 6px;
      }
      .junction .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .junction .name {
        font-size: 15px;
        font-weight: 800;
      }
      .junction .reset {
        height: 30px;
        padding: 0 12px;
        border-radius: 999px;
        background: var(--press);
        font-size: 13px;
        font-weight: 800;
      }
      .junction .reset:hover {
        background: var(--hover);
      }

      .bar {
        left: 50%;
        bottom: var(--above-strip);
        transform: translateX(-50%);
        display: flex;
        align-items: stretch;
        gap: 6px;
        padding: 8px;
        border-radius: 26px;
      }
      /* The bar's two rows: the Layouts, then the Zones, as wide as the Layouts, under a divider that names the one picked
         or under the pointer. The name sits in the divider, so a long one never widens the bar. */
      .picks {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .layouts,
      .zone-picks {
        display: flex;
        gap: 4px;
      }
      .zones {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .zone-name {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--ink-soft);
        white-space: nowrap;
      }
      .zone-name::before,
      .zone-name::after {
        content: '';
        flex: 1;
        border-top: 1px solid var(--line);
      }
      .zone {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 14px;
        cursor: grab;
        touch-action: none;
      }
      .zone svg {
        display: block;
        filter: drop-shadow(0 1px 1px rgba(16, 24, 48, 0.12));
      }
      /* A Zone dragged toward a placed Tile: its picture follows the pointer. */
      #ui .zone-ghost {
        left: 0;
        top: 0;
        pointer-events: none;
        filter: drop-shadow(0 4px 8px rgba(16, 24, 48, 0.25));
      }
      .layout {
        width: 84px;
        padding: 6px 0 5px;
        border-radius: 18px;
        text-align: center;
        font-size: 13px;
        white-space: nowrap;
        cursor: grab;
        touch-action: none;
      }
      .layout svg {
        display: block;
        margin: 0 auto 3px;
        filter: drop-shadow(0 1px 1px rgba(16, 24, 48, 0.12));
      }
      /* The Layout in the hand while the Price is out of reach: the grey of a Tile the player cannot afford. */
      #ui .layout.short {
        background: #7b818c;
        box-shadow: 0 3px 10px rgba(123, 129, 140, 0.4);
      }
      .bar .side {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        min-width: 112px;
        padding: 0 10px 0 14px;
        border-left: 1px solid var(--line);
      }
      .bar .price span {
        display: block;
      }
      .bar .price b {
        font-size: 22px;
        font-weight: 800;
      }
      .undo {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        align-self: flex-start;
        height: 30px;
        padding: 0 12px 0 10px;
        border-radius: 999px;
        background: var(--press);
        font-size: 13px;
        font-weight: 800;
      }
      /* Out of its window Undo keeps its place, so the Price beside it does not move. */
      .undo.gone {
        visibility: hidden;
      }

      .round {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        display: grid;
        place-items: center;
      }
      .menu {
        left: var(--edge);
        bottom: var(--above-strip);
      }
      .menu .sheet {
        position: absolute;
        left: 0;
        bottom: 60px;
        width: 268px;
        padding: 8px;
        border-radius: 22px;
      }
      .menu .item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        min-height: 42px;
        padding: 4px 12px;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 800;
        text-align: left;
      }
      .menu .item small {
        display: block;
        font-size: 13px;
        font-weight: 700;
        color: var(--ink-soft);
      }
      .switch {
        position: relative;
        flex: none;
        width: 40px;
        height: 24px;
        border-radius: 999px;
        background: rgba(27, 32, 48, 0.18);
      }
      .switch::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 3px rgba(16, 24, 48, 0.25);
      }
      [aria-checked='true'] .switch {
        background: var(--accent);
      }
      [aria-checked='true'] .switch::after {
        left: 19px;
      }
      .keys {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 7px 12px;
        margin: 6px 0 0;
        padding: 12px 12px 6px;
        border-top: 1px solid var(--line);
        font-size: 13px;
      }
      .keys dd {
        margin: 0;
        white-space: nowrap;
        color: var(--ink-soft);
      }
      kbd {
        display: inline-grid;
        place-items: center;
        min-width: 24px;
        height: 24px;
        padding: 0 6px;
        box-sizing: border-box;
        border-radius: 7px;
        background: var(--press);
        font: inherit;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
