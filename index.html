<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clearway</title>
    <!-- M PLUS Rounded 1c ships with the game (public/fonts, with its licence): its Latin letters, at the two weights
         the screen uses. Its digits are fixed-width, so yen does not jitter as it counts.
         ponytail: only the Latin subset ships, 22 KB a weight. Any other script on the screen falls back to the system's
         fonts; Japanese stays in the speech bubbles, which the renderer draws in its own. Add the font's Japanese
         subsets beside these, each with its unicode-range, if the screen ever sets Japanese. -->
    <link rel="preload" href="/fonts/m-plus-rounded-1c-latin-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/m-plus-rounded-1c-latin-800.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'M PLUS Rounded 1c';
        font-weight: 700;
        font-display: block;
        src: url('/fonts/m-plus-rounded-1c-latin-700.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'M PLUS Rounded 1c';
        font-weight: 800;
        font-display: block;
        src: url('/fonts/m-plus-rounded-1c-latin-800.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      :root {
        --ink: #1b2030;
        --ink-soft: #545c6e;
        --line: rgba(27, 32, 48, 0.1);
        --press: rgba(27, 32, 48, 0.08);
        --hover: rgba(255, 255, 255, 0.55);
        /* Neutral frosted glass with no tint of its own, so it takes on the sky behind it. */
        --glass: rgba(255, 255, 255, 0.58);
        --glass-edge: rgba(255, 255, 255, 0.78);
        --shade: 0 8px 28px rgba(16, 24, 48, 0.16), 0 1px 3px rgba(16, 24, 48, 0.1);
        --edge: 18px;
        /* The accents, the only saturated colour on the screen: the yen fill, the Flow fill, the selected button and a
           Stage's stars. */
        --yen: #ffb000;
        --yen-deep: #ff9500;
        --flow: #16c172;
        --accent: #ff3d8b;
        --star: #f0a400;
        --font: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f6f6f3;
        font: 700 14px var(--font);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      #scene {
        width: 100%;
        height: 100%;
        display: block;
        /* A left drag pans the board. */
        cursor: grab;
        touch-action: none;
      }
      .labels {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .labels div {
        position: absolute;
        left: 0;
        top: 0;
        white-space: nowrap;
        font-size: 13px;
        letter-spacing: 0.02em;
        color: var(--ink-soft);
        text-shadow:
          0 0 2px #fff,
          0 0 3px #fff,
          0 0 6px #fff,
          0 0 10px rgba(255, 255, 255, 0.8);
      }
      /* While the Tile in the hand is over a legal cell: a Gateway its drop would close is struck through, and one it
         would open shows its trips a minute in the green of a legal drop. */
      .labels .closed {
        text-decoration: line-through 2px;
      }
      .labels .opened {
        color: #1f9d63;
        font-weight: 800;
      }

      /* Jam markers: a hot red-orange disc with the anger mark over each Junction with a Jam, its tail pointing down at
         it, or at the edge of the screen pointing toward one off screen. They pop in, fade out as the Jam clears, and
         fade back while a Layout is in the hand, when every click is a drop. */
      .jams {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .jam {
        position: absolute;
        left: -16px;
        top: -16px;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        pointer-events: auto;
        will-change: transform;
        transition: opacity 0.2s;
      }
      .jams.busy .jam,
      .jam.gone {
        pointer-events: none;
      }
      .jams.busy .jam {
        opacity: 0.45;
      }
      .jam .pop {
        position: absolute;
        inset: 0;
        filter: drop-shadow(0 2px 3px rgba(16, 24, 48, 0.35));
        animation: jam-in 0.36s cubic-bezier(0.3, 1.6, 0.5, 1) both;
      }
      .jam.gone .pop {
        animation: jam-out 0.25s ease-in both;
      }
      .jam svg {
        position: absolute;
        left: 0;
        top: 0;
      }
      .jam .tail {
        left: -12px;
        top: -12px;
      }
      @keyframes jam-in {
        from {
          transform: scale(0.2);
          opacity: 0;
        }
      }
      @keyframes jam-out {
        to {
          transform: scale(0.5);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .jam .pop,
        .jam.gone .pop {
          animation-duration: 1ms;
        }
      }

      /* Stages: a bar over the placed Tile under the pointer, below where a Jam marker floats, with its Stage and its trips
         toward the next; and a badge that rises over a Tile as its Stage-up ends. */
      .growth-layer {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      /* As wide as its note, and no narrower than 132 px: the screen centres it under its Tile. */
      .tile-bar {
        position: absolute;
        left: 0;
        top: 0;
        width: max-content;
        min-width: 132px;
        padding: 6px 9px 7px;
        box-sizing: border-box;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 4px 14px rgba(16, 24, 48, 0.18);
        font-size: 12px;
        will-change: transform;
      }
      .tile-bar[hidden] {
        display: none;
      }
      .tile-bar .head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .tile-bar .stars {
        color: var(--star);
        letter-spacing: 1px;
      }
      .tile-bar .track {
        height: 6px;
        margin: 4px 0 3px;
        border-radius: 3px;
        background: var(--line);
        overflow: hidden;
      }
      .tile-bar .track i {
        display: block;
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #2bd98a, var(--flow));
      }
      .tile-bar .note {
        color: var(--ink-soft);
        font-size: 11px;
        white-space: nowrap;
      }
      .tile-bar.full .track i {
        background: linear-gradient(90deg, var(--yen), var(--yen-deep));
      }
      .tile-bar.jammed .track i {
        background: #9aa0ab;
      }
      .tile-bar.jammed .note {
        color: #ff4a1f;
        font-weight: 800;
      }
      .tile-bar.unzoned .track {
        display: none;
      }
      .stage-badge {
        position: absolute;
        left: 0;
        top: 0;
        will-change: transform;
      }
      .stage-badge span {
        position: absolute;
        left: -60px;
        width: 120px;
        top: -40px;
        display: grid;
        justify-items: center;
        gap: 1px;
        font-size: 18px;
        color: var(--star);
        text-shadow:
          0 0 3px #fff,
          0 0 6px #fff,
          0 1px 8px rgba(255, 255, 255, 0.9);
        animation: badge-rise 1.8s ease-out both;
      }
      .stage-badge b {
        font-size: 16px;
        font-weight: 800;
        color: var(--ink);
      }
      @keyframes badge-rise {
        0% {
          transform: translateY(10px) scale(0.4);
          opacity: 0;
        }
        15% {
          transform: translateY(0) scale(1.12);
          opacity: 1;
        }
        25% {
          transform: translateY(-4px) scale(1);
        }
        75% {
          opacity: 1;
        }
        100% {
          transform: translateY(-56px) scale(1);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .stage-badge span {
          animation: badge-fade 1.8s ease-out both;
        }
        @keyframes badge-fade {
          0%,
          100% {
            opacity: 0;
          }
          15%,
          75% {
            opacity: 1;
          }
        }
      }

      /* --- The screen: money top-left, traffic top-centre, the clock top-right, the bar bottom-centre, the camera's
             buttons bottom-right and the menu bottom-left. Nothing covers the middle of the board. --- */
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        user-select: none;
      }
      #ui > * {
        position: absolute;
        pointer-events: auto;
      }
      #ui [hidden] {
        display: none;
      }
      .glass {
        background: var(--glass);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
        border: 1px solid var(--glass-edge);
        box-shadow: var(--shade);
      }
      button {
        font: inherit;
        color: inherit;
        border: 0;
        background: none;
        padding: 0;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      #ui .on {
        background: var(--accent);
        color: #fff;
        box-shadow: 0 3px 10px rgba(255, 61, 139, 0.4);
      }
      .soft {
        font-size: 13px;
        color: var(--ink-soft);
      }

      .money {
        top: var(--edge);
        left: var(--edge);
        min-width: 232px;
        padding: 12px 18px 13px;
        border-radius: 22px;
      }
      .money .yen {
        font-size: 34px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      .money .yen small {
        font-size: 22px;
        margin-right: 2px;
      }
      .fill {
        position: relative;
        height: 8px;
        margin: 10px 0 7px;
        border-radius: 4px;
        background: var(--line);
        overflow: hidden;
      }
      .fill i {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: 4px;
        background: linear-gradient(90deg, var(--yen), var(--yen-deep));
      }
      .money .income {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      /* Growth, the sum of every Tile's Stage, under the yen, with how many Tiles are at each Stage and the Record. */
      .growth {
        top: calc(var(--edge) + 114px);
        left: var(--edge);
        padding: 8px 16px 9px;
        border-radius: 18px;
      }
      .growth .row {
        display: flex;
        align-items: baseline;
        gap: 10px;
        white-space: nowrap;
      }
      .growth .label {
        font-size: 15px;
        font-weight: 800;
      }
      .growth .total {
        font-size: 24px;
        font-weight: 800;
        line-height: 1;
      }
      .growth .stages {
        margin-left: 4px;
      }
      .growth .stages i {
        font-style: normal;
        color: var(--star);
      }
      .growth .record {
        margin-top: 3px;
      }
      /* Dev only: the pace of growth, when it is sped up. */
      .growth .pace {
        margin-top: 2px;
        color: var(--accent);
        font-weight: 800;
      }

      .flow {
        top: var(--edge);
        left: 50%;
        transform: translateX(-50%);
        width: 380px;
        /* Clear of the money on the left and the clock on the right in a narrow window. */
        max-width: calc(100vw - 638px);
        padding: 11px 18px 12px;
        border-radius: 22px;
      }
      .flow .row {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .flow .label {
        font-size: 15px;
        font-weight: 800;
      }
      .flow .pct {
        margin-left: auto;
        font-size: 22px;
        font-weight: 800;
      }
      .gauge {
        position: relative;
        height: 12px;
        margin: 8px 0 7px;
        border-radius: 6px;
        background: var(--line);
      }
      .gauge i {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: 6px;
        background: linear-gradient(90deg, #2bd98a, var(--flow));
        transition: width 0.2s;
      }
      /* A notice under the readings, as when a saved City would not load: one line, gone after a while or a click. */
      .notice {
        top: calc(var(--edge) + 115px);
        left: 50%;
        transform: translateX(-50%);
        padding: 9px 18px;
        border-radius: 999px;
        white-space: nowrap;
        cursor: pointer;
        transition:
          opacity 0.6s,
          visibility 0s;
      }
      .notice.gone {
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.6s,
          visibility 0s 0.6s;
      }

      .speed {
        top: var(--edge);
        right: var(--edge);
        display: flex;
        gap: 4px;
        padding: 5px;
        border-radius: 999px;
      }
      .speed button {
        min-width: 46px;
        height: 38px;
        padding: 0 10px;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 800;
        display: grid;
        place-items: center;
      }
      .speed button:not(.on):hover,
      .layout:not(.on):hover,
      .zone:not(.on):hover,
      .menu .item:hover {
        background: var(--hover);
      }

      /* The selected Junction's panel under the clock: its name, Reset and a hint. Its Tools are in the world. */
      .junction {
        top: calc(var(--edge) + 60px);
        right: var(--edge);
        width: 236px;
        padding: 10px 12px 12px 16px;
        border-radius: 22px;
        display: grid;
        gap: 6px;
      }
      .junction .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .junction .name {
        font-size: 15px;
        font-weight: 800;
      }
      .junction .reset {
        height: 30px;
        padding: 0 12px;
        border-radius: 999px;
        background: var(--press);
        font-size: 13px;
        font-weight: 800;
      }
      .junction .reset:hover {
        background: var(--hover);
      }

      .bar {
        left: 50%;
        bottom: var(--edge);
        transform: translateX(-50%);
        display: flex;
        align-items: stretch;
        gap: 6px;
        padding: 8px;
        border-radius: 26px;
      }
      /* The bar's two rows: the Layouts, then the Zones, as wide as the Layouts, under a divider that names the one picked
         or under the pointer. The name sits in the divider, so a long one never widens the bar. */
      .picks {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .layouts,
      .zone-picks {
        display: flex;
        gap: 4px;
      }
      .zones {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .zone-name {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--ink-soft);
        white-space: nowrap;
      }
      .zone-name::before,
      .zone-name::after {
        content: '';
        flex: 1;
        border-top: 1px solid var(--line);
      }
      .zone {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 14px;
        cursor: grab;
        touch-action: none;
      }
      .zone svg {
        display: block;
        filter: drop-shadow(0 1px 1px rgba(16, 24, 48, 0.12));
      }
      /* A Zone dragged toward a placed Tile: its picture follows the pointer. */
      #ui .zone-ghost {
        left: 0;
        top: 0;
        pointer-events: none;
        filter: drop-shadow(0 4px 8px rgba(16, 24, 48, 0.25));
      }
      .layout {
        width: 84px;
        padding: 6px 0 5px;
        border-radius: 18px;
        text-align: center;
        font-size: 13px;
        white-space: nowrap;
        cursor: grab;
        touch-action: none;
      }
      .layout svg {
        display: block;
        margin: 0 auto 3px;
        filter: drop-shadow(0 1px 1px rgba(16, 24, 48, 0.12));
      }
      /* The Layout in the hand while the Price is out of reach: the grey of a Tile the player cannot afford. */
      #ui .layout.short {
        background: #7b818c;
        box-shadow: 0 3px 10px rgba(123, 129, 140, 0.4);
      }
      .bar .side {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        min-width: 112px;
        padding: 0 10px 0 14px;
        border-left: 1px solid var(--line);
      }
      .bar .price span {
        display: block;
      }
      .bar .price b {
        font-size: 22px;
        font-weight: 800;
      }
      .undo {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        align-self: flex-start;
        height: 30px;
        padding: 0 12px 0 10px;
        border-radius: 999px;
        background: var(--press);
        font-size: 13px;
        font-weight: 800;
      }
      /* Out of its window Undo keeps its place, so the Price beside it does not move. */
      .undo.gone {
        visibility: hidden;
      }

      .round {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        display: grid;
        place-items: center;
      }
      .menu {
        left: var(--edge);
        bottom: var(--edge);
      }
      .camera {
        right: var(--edge);
        bottom: var(--edge);
        display: flex;
        gap: 10px;
      }
      /* In a narrow window the camera's buttons stand in a column, clear of the bar. */
      @media (max-width: 1000px) {
        .camera {
          flex-direction: column;
        }
      }
      /* The Stage Inspector's legend, over the camera's buttons while it is on: each Stage's tint as it lies on the
         ground, and the stripes of a Tile a Jam holds back. */
      .stage-legend {
        right: var(--edge);
        bottom: calc(var(--edge) + 62px);
        display: grid;
        gap: 7px;
        padding: 9px 14px 10px;
        border-radius: 18px;
        font-size: 13px;
      }
      .stage-legend .row {
        display: flex;
        gap: 14px;
        white-space: nowrap;
      }
      .stage-legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .stage-legend .row:first-child span {
        color: var(--star);
        letter-spacing: 1px;
      }
      .stage-legend i {
        width: 18px;
        height: 18px;
        border-radius: 6px;
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .menu .sheet {
        position: absolute;
        left: 0;
        bottom: 60px;
        width: 268px;
        padding: 8px;
        border-radius: 22px;
      }
      .menu .item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        min-height: 42px;
        padding: 4px 12px;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 800;
        text-align: left;
      }
      .menu .item small {
        display: block;
        font-size: 13px;
        font-weight: 700;
        color: var(--ink-soft);
      }
      .switch {
        position: relative;
        flex: none;
        width: 40px;
        height: 24px;
        border-radius: 999px;
        background: rgba(27, 32, 48, 0.18);
      }
      .switch::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 3px rgba(16, 24, 48, 0.25);
      }
      [aria-checked='true'] .switch {
        background: var(--accent);
      }
      [aria-checked='true'] .switch::after {
        left: 19px;
      }
      .keys {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 7px 12px;
        margin: 6px 0 0;
        padding: 12px 12px 6px;
        border-top: 1px solid var(--line);
        font-size: 13px;
      }
      .keys dd {
        margin: 0;
        white-space: nowrap;
        color: var(--ink-soft);
      }
      kbd {
        display: inline-grid;
        place-items: center;
        min-width: 24px;
        height: 24px;
        padding: 0 6px;
        box-sizing: border-box;
        border-radius: 7px;
        background: var(--press);
        font: inherit;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
