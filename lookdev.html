<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traffic Look-dev</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f4f3ed;
      }
      #scene {
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.85);
        font:
          12px/1.45 ui-monospace,
          Menlo,
          monospace;
        color: #222;
        white-space: pre;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/lookdev/main.ts"></script>
  </body>
</html>
