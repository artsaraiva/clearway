<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diorama look (prototype, issue #16)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family:
          system-ui,
          -apple-system,
          'Helvetica Neue',
          sans-serif;
      }
      #scene {
        width: 100%;
        height: 100%;
        display: block;
      }
      #labels {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      #labels div {
        position: absolute;
        left: 0;
        top: 0;
        white-space: nowrap;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: #686c74;
        text-shadow:
          0 0 2px #fff,
          0 0 3px #fff,
          0 0 6px #fff;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.85);
        font:
          12px/1.45 ui-monospace,
          Menlo,
          monospace;
        color: #222;
        white-space: pre;
        pointer-events: none;
      }
      #bar {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 4px;
        padding: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.86);
        backdrop-filter: blur(20px) saturate(1.6);
        box-shadow: 0 8px 24px rgba(40, 60, 90, 0.16);
      }
      #bar button {
        font: 600 13px system-ui;
        padding: 9px 14px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: #3a3c40;
        cursor: pointer;
      }
      #bar button:hover {
        background: rgba(0, 0, 0, 0.06);
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="labels"></div>
    <div id="hud"></div>
    <div id="bar"></div>
    <script type="module" src="/src/lookdev/diorama.ts"></script>
  </body>
</html>
